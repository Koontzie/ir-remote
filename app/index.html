<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IR-Remote</title>
<style>
  :root {
    --bg: #14161a;
    --card: #1d2026;
    --edge: #2c313a;
    --ink: #e8eaed;
    --dim: #9aa2ad;
    --accent: #4f9cf9;
    --ok: #3ecf8e;
    --err: #ff6b6b;
    --gold: #f0c86a;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    padding-bottom: 96px;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-text-size-adjust: 100%;
  }
  header { max-width: 640px; margin: 0 auto 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--dim); font-size: 13px; }
  main { max-width: 640px; margin: 0 auto; }

  button {
    font: inherit;
    font-weight: 600;
    border: 0;
    border-radius: 9px;
    padding: 11px 16px;
    cursor: pointer;
    color: #fff;
    background: var(--accent);
    min-height: 44px;               /* comfortable touch target */
  }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.ghost {
    background: transparent;
    border: 1px solid var(--edge);
    color: var(--ink);
  }
  button.small { min-height: 36px; padding: 7px 12px; font-size: 13px; }
  #connect { width: 100%; margin-bottom: 18px; }

  .slot {
    background: var(--card);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
  }
  .slot h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--dim);
    margin: 0 0 10px;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.grow { flex: 1 1 150px; }
  .field.narrow { flex: 0 0 82px; }
  label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
  input, select {
    font: inherit;
    font-size: 16px;               /* >=16px stops iOS zoom-on-focus */
    padding: 10px;
    border-radius: 9px;
    border: 1px solid var(--edge);
    background: #171a1f;
    color: var(--ink);
    width: 100%;
    min-height: 44px;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .actions { margin-top: 10px; display: flex; gap: 8px; }
  .actions button { flex: 1; }

  .device {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: #171a1f;
    border: 1px solid var(--edge);
    border-radius: 9px;
    padding: 9px 11px;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .device .none { color: var(--dim); font-style: italic; }
  .readout {
    margin: 9px 0 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--dim);
  }
  .readout .empty { color: #d9884f; }
  details { margin-top: 10px; }
  summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  details .row { margin-top: 8px; }

  #status {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: #0f1114;
    border-top: 1px solid var(--edge);
    font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--dim);
    white-space: nowrap;
    overflow-x: auto;
  }
  #status.ok  { color: var(--ok); }
  #status.err { color: var(--err); }
  /* physical button press on the device flashes the matching slot */
  @keyframes slotFlash {
    0%   { border-color: var(--accent); background: #23303f; }
    100% { border-color: var(--edge);   background: var(--card); }
  }
  .slot.pressed { animation: slotFlash 900ms ease-out; }
  @media (prefers-reduced-motion: reduce) {
    .slot.pressed { animation: none; border-color: var(--accent); }
  }

  .library {
    background: var(--card);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 18px;
  }
  .library h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--dim);
    margin: 0 0 10px;
  }
  #libSearch { font-size: 16px; }
  .lib-slot { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; font-size: 12px; color: var(--dim); }
  .lib-slot select { width: auto; min-width: 64px; }

  /* search results: one tappable card per brand */
  .hit {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: #171a1f;
    border: 1px solid var(--edge);
    border-radius: 9px;
    padding: 10px 12px;
    margin-top: 8px;
    cursor: pointer;
  }
  .hit:hover { border-color: var(--accent); }
  .hit .name { font-weight: 600; }
  .hit .meta { font-size: 12px; color: var(--dim); }
  .hit .badge {
    font-size: 11px; font-weight: 700; color: #10141a; background: var(--gold);
    border-radius: 6px; padding: 2px 6px; white-space: nowrap;
  }

  /* a single code row (brand view) */
  .grp { margin-top: 14px; }
  .grp .glabel { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin-bottom: 6px; }
  .grp.generic .glabel { color: var(--gold); }
  .code {
    display: flex; align-items: center; gap: 8px;
    background: #171a1f;
    border: 1px solid var(--edge);
    border-radius: 9px;
    padding: 8px 10px;
    margin-top: 6px;
  }
  .code.gen { border-color: #5c4718; }
  .code .cinfo { flex: 1 1 auto; min-width: 0; }
  .code .cname { font-size: 14px; }
  .code .ctag { font-size: 11px; color: var(--dim); }
  .code .chex { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--dim); }
  .code button { flex: 0 0 auto; }
  .muted { color: var(--dim); }

  #libInfo {
    margin-top: 10px;
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--dim);
    word-break: break-all;
  }
  .backlink { display: inline-block; margin-top: 10px; font-size: 13px; color: var(--accent); cursor: pointer; }
  .warn {
    background: #2a2113;
    border: 1px solid #5c4718;
    color: #f0c86a;
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 16px;
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <h1>IR-Remote</h1>
  <div class="sub">Program IR slots over Bluetooth</div>
</header>

<main>
  <div id="unsupported" class="warn" hidden>
    This browser has no Web Bluetooth. Use desktop Chrome, or
    <strong>Bluefy</strong> on iOS — Safari will not work.
  </div>

  <button id="connect">Connect</button>

  <section class="library">
    <h2>Code library</h2>

    <input id="libSearch" placeholder="Search brand, model, or function — e.g. epson, hdmi, samsung"
           autocapitalize="off" autocorrect="off" spellcheck="false" disabled>

    <div class="lib-slot">
      Assign picked codes into
      <select id="libSlot">
        <option>1</option><option>2</option><option>3</option>
        <option>4</option><option>5</option>
      </select>
    </div>

    <!-- search results (brand hits) -->
    <div id="libResults"></div>

    <!-- a loaded brand's codes (generic first, then by function) -->
    <div id="libBrandView" hidden></div>

    <div id="libInfo">Loading library…</div>

    <details>
      <summary>Browse by category (dropdowns)</summary>
      <div class="row">
        <div class="field grow">
          <label for="libCategory">Category</label>
          <select id="libCategory"><option value="">Loading…</option></select>
        </div>
        <div class="field grow">
          <label for="libBrand">Brand</label>
          <select id="libBrand" disabled><option value="">—</option></select>
        </div>
      </div>
      <div class="row" style="margin-top:8px">
        <div class="field grow">
          <label for="libModel">Model / keymap</label>
          <select id="libModel" disabled><option value="">—</option></select>
        </div>
      </div>
    </details>
  </section>

  <div id="slots"></div>
</main>

<div id="status">idle — not connected</div>

<script>
'use strict';

const SERVICE_UUID = 'b457c32b-22b1-425f-8a88-4d6dc37ba4eb';
const CONFIG_UUID  = 'd997012d-7d2b-47de-ae87-bae14df446ef';
const TRIGGER_UUID = '58397514-04a3-4265-9590-9d910c4e99d2';
const STATUS_UUID  = 'b8ddfe01-519f-430d-bd4e-aba0dd852e2c';

const DEVICE_NAME = 'IR-Remote';

// Protocols the firmware can actually transmit today. The library holds RC5/RC6
// entries too, but the slot dropdown has no option for them — setting .value to
// an absent option fails silently and leaves the PREVIOUS protocol, which would
// save a valid RC5 code tagged as NEC and send garbage with no error shown. So
// library entries are filtered to this list. Phase 5 Sitting B adds RC5/RC6 to
// the firmware; then they only need appending here.
const PROTOCOLS = ['SAMSUNG', 'NEC', 'SONY'];
const SENDABLE = new Set(PROTOCOLS);

// Slot 1 is pre-filled with the Samsung power code proven in Phase 1.
const DEFAULTS = {
  1: { proto: 'SAMSUNG', code: '0xE0E040BF', bits: 32 },
  2: { proto: 'NEC',     code: '',           bits: 32 },
  3: { proto: 'NEC',     code: '',           bits: 32 },
  4: { proto: 'NEC',     code: '',           bits: 32 },
  5: { proto: 'NEC',     code: '',           bits: 32 },
};

let device = null, configChar = null, triggerChar = null, statusChar = null;

const $ = (sel) => document.querySelector(sel);
const statusEl = $('#status');
const esc = (s) => String(s).replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function setStatus(msg, kind) {
  statusEl.textContent = msg;
  statusEl.className = kind || '';
}

function flashSlot(slot) {
  const el = document.getElementById(`slot${slot}`);
  if (!el) return;
  el.classList.remove('pressed');
  void el.offsetWidth;          // reflow so the animation restarts on rapid presses
  el.classList.add('pressed');
}

function connected() {
  return device && device.gatt && device.gatt.connected;
}

function refreshButtons() {
  const on = connected();
  document.querySelectorAll('.slot button').forEach(b => { b.disabled = !on; });
  $('#connect').textContent = on ? 'Disconnect' : 'Connect';
}

// Friendly label for a library entry: prefer the canonical function name, but
// always keep the human original ("Power on — power_on").
function entryLabel(e) {
  return e.name.startsWith('other:') ? e.orig : `${e.orig} — ${e.name}`;
}

// ── build the slot editors ──────────────────────────────────────────────────
function buildSlots() {
  const host = $('#slots');
  for (let slot = 1; slot <= 5; slot++) {
    const d = DEFAULTS[slot];
    const el = document.createElement('div');
    el.className = 'slot';
    el.id = `slot${slot}`;
    el.innerHTML = `
      <h2>Slot ${slot}</h2>
      <div class="device">
        <span id="dev${slot}" class="none">No device assigned</span>
      </div>
      <div class="field">
        <label for="func${slot}">Function</label>
        <select id="func${slot}" disabled><option value="">assign a device first</option></select>
      </div>
      <div class="readout" id="out${slot}"></div>
      <div class="actions">
        <button class="ghost" data-save="${slot}">Save</button>
        <button data-test="${slot}">Test</button>
      </div>
      <details>
        <summary>Advanced — manual hex</summary>
        <div class="row">
          <div class="field grow">
            <label for="proto${slot}">Protocol</label>
            <select id="proto${slot}">
              ${PROTOCOLS.map(p => `<option ${p === d.proto ? 'selected' : ''}>${p}</option>`).join('')}
            </select>
          </div>
          <div class="field grow">
            <label for="code${slot}">Hex code</label>
            <input id="code${slot}" value="${d.code}" placeholder="0xE0E040BF"
                   autocapitalize="off" autocorrect="off" spellcheck="false">
          </div>
          <div class="field narrow">
            <label for="bits${slot}">Bits</label>
            <input id="bits${slot}" type="number" inputmode="numeric" value="${d.bits}" min="1" max="64">
          </div>
        </div>
      </details>`;
    host.appendChild(el);
  }

  host.addEventListener('click', (e) => {
    const save = e.target.dataset.save, test = e.target.dataset.test;
    if (save) saveSlot(Number(save));
    if (test) testSlot(Number(test));
  });

  // Function dropdown drives the slot; manual edits keep the readout honest.
  host.addEventListener('change', (e) => {
    const m = /^(func|proto|code|bits)(\d)$/.exec(e.target.id || '');
    if (!m) return;
    const slot = Number(m[2]);
    if (m[1] === 'func') applyFunction(slot, Number(e.target.value));
    else { slotApplied[slot] = null; updateReadout(slot); }   // manual edit unnames the slot
  });
  host.addEventListener('input', (e) => {
    const m = /^(code|bits)(\d)$/.exec(e.target.id || '');
    if (m) { slotApplied[Number(m[2])] = null; updateReadout(Number(m[2])); }
  });

  for (let slot = 1; slot <= 5; slot++) updateReadout(slot);
}

// ── slot ↔ device binding ───────────────────────────────────────────────────
// A slot is conceptually "this device, this button": the protocol and address
// belong to the device, and only the command changes when you go power → input.
// slotDevice[n] holds the assigned device + entries; slotApplied[n] the entry
// currently in the slot (used to name what a physical press sent).
const slotDevice = {};
const slotApplied = {};

function updateReadout(slot) {
  const proto = $(`#proto${slot}`).value;
  const code = $(`#code${slot}`).value.trim();
  const bits = $(`#bits${slot}`).value;
  const el = $(`#out${slot}`);
  if (!code) {
    el.innerHTML = `<span class="empty">empty — pick a function or enter a hex code</span>`;
    return;
  }
  const named = slotApplied[slot];
  el.textContent = named
    ? `${entryLabel(named)} · ${proto} ${code} · ${bits} bits`
    : `${proto} · ${code} · ${bits} bits`;
}

function applyFunction(slot, idx) {
  const dev = slotDevice[slot];
  const e = dev && dev.entries[idx];
  if (!e) return;
  $(`#proto${slot}`).value = e.proto;
  $(`#code${slot}`).value = e.code;
  $(`#bits${slot}`).value = e.bits;
  slotApplied[slot] = e;
  updateReadout(slot);
  setStatus(`slot ${slot}: ${e.orig} (${e.proto} ${e.code}) — press Save to store it`, 'ok');
}

function assignDevice(slot, { brand, model, entries }, pickIdx = 0) {
  slotDevice[slot] = { brand, model, entries };

  $(`#dev${slot}`).className = '';
  $(`#dev${slot}`).textContent = `${brand} / ${model}`;

  const sel = $(`#func${slot}`);
  sel.innerHTML = entries.map((e, i) =>
    `<option value="${i}">${esc(entryLabel(e))}</option>`).join('');
  sel.disabled = false;
  sel.value = String(pickIdx);
  applyFunction(slot, pickIdx);
}

// ── BLE ─────────────────────────────────────────────────────────────────────
async function connect() {
  if (connected()) { device.gatt.disconnect(); return; }
  try {
    setStatus('requesting device…');
    // Filter on the service UUID, not the name. The name lives in the scan
    // response (it does not fit in the advertisement alongside a 128-bit UUID),
    // and matching the service is more robust than matching a string.
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }],
      optionalServices: [SERVICE_UUID],
    });
    device.addEventListener('gattserverdisconnected', () => {
      setStatus('disconnected', 'err');
      refreshButtons();
    });

    setStatus('connecting…');
    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);

    configChar  = await service.getCharacteristic(CONFIG_UUID);
    triggerChar = await service.getCharacteristic(TRIGGER_UUID);
    statusChar  = await service.getCharacteristic(STATUS_UUID);

    await statusChar.startNotifications();
    statusChar.addEventListener('characteristicvaluechanged', (ev) => {
      const text = new TextDecoder().decode(ev.target.value);

      // A physical button on the device reports "pressed:N" — flash that slot and
      // show WHAT went out (slot, name, proto, code), so you learn a button
      // without opening its config (field feedback: show the code that was sent).
      const pressed = /^pressed:(\d+)$/.exec(text);
      if (pressed) {
        const n = Number(pressed[1]);
        flashSlot(n);
        setStatus(`button ${n} sent → ${slotSummary(n)}`, 'ok');
        return;
      }

      // "err:empty:N" means that button has no code stored yet.
      const empty = /^err:empty:(\d+)$/.exec(text);
      if (empty) { setStatus(`slot ${empty[1]} is empty — save a code to it first`, 'err'); return; }

      setStatus(`device: ${text}`, text.startsWith('err') ? 'err' : 'ok');
    });

    setStatus('connected', 'ok');
    refreshButtons();
  } catch (err) {
    setStatus(`connect failed: ${err.message}`, 'err');
    refreshButtons();
  }
}

// What a slot will transmit, named if it came from the library.
function slotSummary(slot) {
  const code = ($(`#code${slot}`)?.value || '').trim();
  if (!code) return 'empty';
  const proto = $(`#proto${slot}`).value;
  const named = slotApplied[slot];
  return named ? `${entryLabel(named)} (${proto} ${code})` : `${proto} ${code}`;
}

async function write(characteristic, payload) {
  const bytes = new TextEncoder().encode(JSON.stringify(payload));
  // writeValue is deprecated; prefer the explicit form where available.
  if (characteristic.writeValueWithResponse) {
    await characteristic.writeValueWithResponse(bytes);
  } else {
    await characteristic.writeValue(bytes);
  }
}

async function saveSlot(slot) {
  if (!connected()) return setStatus('not connected', 'err');
  const code = $(`#code${slot}`).value.trim();
  if (!code) return setStatus(`slot ${slot}: enter a hex code first`, 'err');

  const payload = {
    slot,
    proto: $(`#proto${slot}`).value,
    code,
    bits: Number($(`#bits${slot}`).value) || 32,
  };
  try {
    setStatus(`saving slot ${slot}…`);
    await write(configChar, payload);
  } catch (err) {
    setStatus(`save failed: ${err.message}`, 'err');
  }
}

async function testSlot(slot) {
  if (!connected()) return setStatus('not connected', 'err');
  try {
    setStatus(`triggering slot ${slot} → ${slotSummary(slot)}…`);
    await write(triggerChar, { slot });
  } catch (err) {
    setStatus(`test failed: ${err.message}`, 'err');
  }
}

// ── code library ────────────────────────────────────────────────────────────
// search.json (one small record per brand) is the front door: type a brand,
// model, or function and jump to matching brands. index.json + brand shards
// drive the dropdown fallback and lazy-load a brand's actual codes. All served
// statically alongside the app, so this works on Pages and localhost alike.

const DATA_BASE = '../data';
let libIndex = null;            // index.json (dropdown fallback)
let searchRecs = [];           // search.json (brand records)
const shardCache = new Map();  // file -> entries[]

// Canonical functions in a useful order. Discrete power_on/power_off come first:
// in AV work toggle is dangerous (it turns already-on gear off), so discrete
// beats toggle wherever a brand has it (field feedback).
const FUNC_ORDER = [
  'power_on', 'power_off', 'power_toggle', 'source_cycle',
  'input_hdmi', 'input_hdmi1', 'input_hdmi2', 'input_hdmi3', 'input_hdmi4',
  'input_vga', 'input_comp', 'vol_up', 'vol_dn', 'mute', 'menu',
];
const funcRank = (n) => {
  const i = FUNC_ORDER.indexOf(n);
  return i === -1 ? FUNC_ORDER.length : i;
};

const libSearch = $('#libSearch'), libResults = $('#libResults');
const libBrandView = $('#libBrandView'), libInfo = $('#libInfo');

async function loadLibrary() {
  try {
    const [idxRes, srchRes] = await Promise.all([
      fetch(`${DATA_BASE}/db/index.json`),
      fetch(`${DATA_BASE}/db/search.json`),
    ]);
    if (!idxRes.ok) throw new Error(`index HTTP ${idxRes.status}`);
    if (!srchRes.ok) throw new Error(`search HTTP ${srchRes.status}`);
    libIndex = await idxRes.json();
    searchRecs = await srchRes.json();

    // dropdown fallback
    fillSelect(libCategory, Object.entries(libIndex).map(([slug, c]) => ({
      value: slug,
      label: `${c.label} (${Object.keys(c.brands).length} brands)`,
    })), 'Select category…');

    libSearch.disabled = false;
    const brands = searchRecs.length;
    const codes = searchRecs.reduce((n, r) => n + r.n, 0);
    libInfo.textContent =
      `${brands} brands · ${codes} codes. Type to search, or browse by category below.`;
  } catch (err) {
    libInfo.textContent = `Code library unavailable: ${err.message}`;
    libCategory.innerHTML = '<option value="">unavailable</option>';
  }
}

// ── search ────────────────────────────────────────────────────────────────
let searchTimer = null;
libSearch.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 120);
});

function runSearch() {
  const q = libSearch.value.trim().toLowerCase();
  libBrandView.hidden = true;
  libBrandView.innerHTML = '';
  if (!q) { libResults.innerHTML = ''; return; }

  const terms = q.split(/\s+/);
  const scored = [];
  for (const r of searchRecs) {
    // Build the haystack once per record: brand, category, functions, models.
    const hay = (r._hay ||= [
      r.b, r.cl, r.c, r.fn.join(' '), r.m.join(' '),
    ].join(' ').toLowerCase());
    if (!terms.every(t => hay.includes(t))) continue;

    // Rank: brand-name hits beat model/function hits; more codes breaks ties.
    const brandHit = terms.some(t => r.b.toLowerCase().includes(t));
    scored.push({ r, score: (brandHit ? 0 : 1), n: r.n });
  }
  scored.sort((a, b) => a.score - b.score || b.n - a.n || a.r.b.localeCompare(b.r.b));

  if (!scored.length) { libResults.innerHTML = `<div class="muted" style="margin-top:8px">No matches.</div>`; return; }

  const shown = scored.slice(0, 40);
  libResults.innerHTML = shown.map(({ r }, i) => {
    const gen = r.g ? `<span class="badge">${r.g} generic</span>` : '';
    return `<div class="hit" data-i="${i}">
      <div>
        <div class="name">${esc(r.b)}</div>
        <div class="meta">${esc(r.cl)} · ${r.n} codes${r.m.length > 1 ? ` · ${r.m.length} models` : ''}</div>
      </div>${gen}
    </div>`;
  }).join('') + (scored.length > 40
      ? `<div class="muted" style="margin-top:8px">+${scored.length - 40} more — refine the search.</div>` : '');

  libResults._hits = shown.map(s => s.r);
}

libResults.addEventListener('click', (e) => {
  const card = e.target.closest('.hit');
  if (!card) return;
  const rec = libResults._hits?.[Number(card.dataset.i)];
  if (rec) openBrand(rec);
});

// ── brand view: a brand's codes, generic (blanket) first ────────────────────
async function fetchShard(file) {
  let entries = shardCache.get(file);
  if (entries) return entries;
  const res = await fetch(`${DATA_BASE}/db/${file}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  entries = await res.json();
  shardCache.set(file, entries);
  return entries;
}

async function openBrand(rec) {
  libResults.innerHTML = '';
  libBrandView.hidden = false;
  libBrandView.innerHTML = `<div class="muted">Loading ${esc(rec.b)}…</div>`;
  let entries;
  try {
    entries = await fetchShard(rec.f);
  } catch (err) {
    libBrandView.innerHTML = `<div class="muted">Could not load ${esc(rec.b)}: ${esc(err.message)}</div>`;
    return;
  }

  // Only sendable protocols; RAW and RC5/RC6 stay in the data but are hidden
  // until Sitting B adds firmware support (no re-scrape needed then).
  const sendable = entries.filter(e => SENDABLE.has(e.proto));
  const hidden = entries.length - sendable.length;

  // Assigning a code binds the WHOLE brand keymap to the slot, so the slot's
  // Function dropdown can later swap power → input without returning here. Use a
  // stable ordering so an entry's index is the same in the row and the slot.
  const ordered = sendable.slice().sort((a, b) =>
    funcRank(a.name) - funcRank(b.name) || a.orig.localeCompare(b.orig));
  libBrandView._entries = ordered;
  libBrandView._brand = rec.b;

  const generic = ordered.filter(e => e.generic);
  const rest = ordered.filter(e => !e.generic);

  const row = (e) => {
    const idx = ordered.indexOf(e);
    const isToggle = e.name === 'power_toggle';
    const tag = e.name.startsWith('other:') ? '' :
      `<span class="ctag">${esc(e.name)}${e.nmodels ? ` · ${e.nmodels} models` : ''}` +
      `${isToggle ? ' · toggle (fallback)' : ''}</span>`;
    return `<div class="code${e.generic ? ' gen' : ''}">
      <div class="cinfo">
        <div class="cname">${esc(e.orig)}</div>
        ${tag}
        <div class="chex">${e.proto} ${e.code} · ${e.bits} bits</div>
      </div>
      <button class="small" data-assign="${idx}">Assign</button>
    </div>`;
  };

  let html = `<span class="backlink" id="libBack">← back to search</span>
    <div style="margin-top:8px"><strong>${esc(rec.b)}</strong>
      <span class="muted">· ${esc(rec.cl)} · ${sendable.length} sendable codes` +
      `${hidden ? ` · ${hidden} hidden (RAW/RC5/RC6)` : ''}</span></div>`;

  if (generic.length) {
    html += `<div class="grp generic"><div class="glabel">★ Generic — blanket codes (work across many models; try these first)</div>` +
      generic.map(row).join('') + `</div>`;
  }
  html += `<div class="grp"><div class="glabel">All codes</div>` +
    rest.map(row).join('') + `</div>`;

  libBrandView.innerHTML = html;
}

libBrandView.addEventListener('click', (e) => {
  if (e.target.id === 'libBack') {
    libBrandView.hidden = true;
    runSearch();
    return;
  }
  const a = e.target.dataset.assign;
  if (a === undefined) return;
  const entries = libBrandView._entries || [];
  const idx = Number(a);
  const chosen = entries[idx];
  if (!chosen) return;
  const slot = Number($('#libSlot').value);
  assignDevice(slot, { brand: chosen.brand, model: chosen.model, entries }, idx);
  flashSlot(slot);
  document.getElementById(`slot${slot}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  setStatus(`slot ${slot} ← ${chosen.brand}: ${entryLabel(chosen)} ` +
            `(${entries.length} functions available)`, 'ok');
});

// ── dropdown fallback (browse by category) ──────────────────────────────────
const libCategory = $('#libCategory'), libBrand = $('#libBrand'), libModel = $('#libModel');

function fillSelect(sel, items, placeholder) {
  sel.innerHTML = `<option value="">${placeholder}</option>` +
    items.map(({ value, label }) =>
      `<option value="${esc(value)}">${esc(label)}</option>`).join('');
  sel.disabled = items.length === 0;
}

libCategory.addEventListener('change', () => {
  const cat = libIndex?.[libCategory.value];
  clearSel(libBrand); clearSel(libModel);
  if (!cat) return;
  const brands = Object.entries(cat.brands)
    .sort((a, b) => a[0].localeCompare(b[0]))
    .map(([name, b]) => ({ value: name, label: `${name} (${b.total})` }));
  fillSelect(libBrand, brands, 'Select brand…');
});

libBrand.addEventListener('change', () => {
  clearSel(libModel);
  const cat = libIndex?.[libCategory.value];
  const brand = cat?.brands[libBrand.value];
  if (!brand) return;
  // Reuse the brand view — same lazy fetch, generic-first rendering.
  openBrand({ b: libBrand.value, cl: cat.label, c: libCategory.value, f: brand.file,
              n: brand.total, g: brand.generic || 0, m: [] });
});

function clearSel(sel) { sel.innerHTML = '<option value="">—</option>'; sel.disabled = true; }

// ── init ────────────────────────────────────────────────────────────────────
buildSlots();
refreshButtons();
loadLibrary();
$('#connect').addEventListener('click', connect);

if (!navigator.bluetooth) {
  $('#unsupported').hidden = false;
  $('#connect').disabled = true;
  setStatus('Web Bluetooth unavailable in this browser', 'err');
}
</script>
</body>
</html>
