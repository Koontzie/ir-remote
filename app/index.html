<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IR-Remote</title>
<style>
  :root {
    --bg: #14161a;
    --card: #1d2026;
    --edge: #2c313a;
    --ink: #e8eaed;
    --dim: #9aa2ad;
    --accent: #4f9cf9;
    --ok: #3ecf8e;
    --err: #ff6b6b;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    padding-bottom: 96px;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-text-size-adjust: 100%;
  }
  header { max-width: 640px; margin: 0 auto 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--dim); font-size: 13px; }
  main { max-width: 640px; margin: 0 auto; }

  button {
    font: inherit;
    font-weight: 600;
    border: 0;
    border-radius: 9px;
    padding: 11px 16px;
    cursor: pointer;
    color: #fff;
    background: var(--accent);
    min-height: 44px;               /* comfortable touch target */
  }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.ghost {
    background: transparent;
    border: 1px solid var(--edge);
    color: var(--ink);
  }
  #connect { width: 100%; margin-bottom: 18px; }

  .slot {
    background: var(--card);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
  }
  .slot h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--dim);
    margin: 0 0 10px;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.grow { flex: 1 1 150px; }
  .field.narrow { flex: 0 0 82px; }
  label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
  input, select {
    font: inherit;
    font-size: 16px;               /* >=16px stops iOS zoom-on-focus */
    padding: 10px;
    border-radius: 9px;
    border: 1px solid var(--edge);
    background: #171a1f;
    color: var(--ink);
    width: 100%;
    min-height: 44px;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .actions { margin-top: 10px; display: flex; gap: 8px; }
  .actions button { flex: 1; }

  .device {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: #171a1f;
    border: 1px solid var(--edge);
    border-radius: 9px;
    padding: 9px 11px;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .device .none { color: var(--dim); font-style: italic; }
  .readout {
    margin: 9px 0 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--dim);
  }
  .readout .empty { color: #d9884f; }
  details { margin-top: 10px; }
  summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  details .row { margin-top: 8px; }

  #status {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: #0f1114;
    border-top: 1px solid var(--edge);
    font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--dim);
    white-space: nowrap;
    overflow-x: auto;
  }
  #status.ok  { color: var(--ok); }
  #status.err { color: var(--err); }
  /* physical button press on the device flashes the matching slot */
  @keyframes slotFlash {
    0%   { border-color: var(--accent); background: #23303f; }
    100% { border-color: var(--edge);   background: var(--card); }
  }
  .slot.pressed { animation: slotFlash 900ms ease-out; }
  @media (prefers-reduced-motion: reduce) {
    .slot.pressed { animation: none; border-color: var(--accent); }
  }
  .library {
    background: var(--card);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 18px;
  }
  .library h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--dim);
    margin: 0 0 10px;
  }
  .library .row + .row { margin-top: 8px; }
  .lib-apply { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; }
  .lib-apply .field { flex: 0 0 110px; }
  .lib-apply button { flex: 1; }
  #libInfo {
    margin-top: 10px;
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--dim);
    word-break: break-all;
  }
  .warn {
    background: #2a2113;
    border: 1px solid #5c4718;
    color: #f0c86a;
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 16px;
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <h1>IR-Remote</h1>
  <div class="sub">Program IR slots over Bluetooth</div>
</header>

<main>
  <div id="unsupported" class="warn" hidden>
    This browser has no Web Bluetooth. Use desktop Chrome, or
    <strong>Bluefy</strong> on iOS — Safari will not work.
  </div>

  <button id="connect">Connect</button>

  <section class="library">
    <h2>Code library</h2>
    <div class="row">
      <div class="field grow">
        <label for="libCategory">Category</label>
        <select id="libCategory"><option value="">Loading…</option></select>
      </div>
      <div class="field grow">
        <label for="libBrand">Brand</label>
        <select id="libBrand" disabled><option value="">—</option></select>
      </div>
    </div>
    <div class="row">
      <div class="field grow">
        <label for="libModel">Model / keymap</label>
        <select id="libModel" disabled><option value="">—</option></select>
      </div>
      <div class="field grow">
        <label for="libFunction">Function</label>
        <select id="libFunction" disabled><option value="">—</option></select>
      </div>
    </div>
    <div class="lib-apply">
      <div class="field">
        <label for="libSlot">Into slot</label>
        <select id="libSlot">
          <option>1</option><option>2</option><option>3</option>
          <option>4</option><option>5</option>
        </select>
      </div>
      <button class="ghost" id="libApply" disabled>Assign to slot</button>
    </div>
    <div id="libInfo">Pick a category to browse. Manual hex entry still works below.</div>
  </section>

  <div id="slots"></div>
</main>

<div id="status">idle — not connected</div>

<script>
'use strict';

const SERVICE_UUID = 'b457c32b-22b1-425f-8a88-4d6dc37ba4eb';
const CONFIG_UUID  = 'd997012d-7d2b-47de-ae87-bae14df446ef';
const TRIGGER_UUID = '58397514-04a3-4265-9590-9d910c4e99d2';
const STATUS_UUID  = 'b8ddfe01-519f-430d-bd4e-aba0dd852e2c';

const DEVICE_NAME = 'IR-Remote';

// Protocols the firmware can actually transmit today. The library holds RC5/RC6
// entries too, but the slot dropdown has no option for them — setting .value to
// an absent option fails silently and leaves the PREVIOUS protocol, which would
// save a valid RC5 code tagged as NEC and send garbage with no error shown. So
// library entries are filtered to this list. Phase 5 Sitting B adds RC5/RC6 to
// the firmware; then they only need appending here.
const PROTOCOLS = ['SAMSUNG', 'NEC', 'SONY'];
const SENDABLE = new Set(PROTOCOLS);

// Slot 1 is pre-filled with the Samsung power code proven in Phase 1.
const DEFAULTS = {
  1: { proto: 'SAMSUNG', code: '0xE0E040BF', bits: 32 },
  2: { proto: 'NEC',     code: '',           bits: 32 },
  3: { proto: 'NEC',     code: '',           bits: 32 },
  4: { proto: 'NEC',     code: '',           bits: 32 },
  5: { proto: 'NEC',     code: '',           bits: 32 },
};

let device = null, configChar = null, triggerChar = null, statusChar = null;

const $ = (sel) => document.querySelector(sel);
const statusEl = $('#status');

function setStatus(msg, kind) {
  statusEl.textContent = msg;
  statusEl.className = kind || '';
}

function flashSlot(slot) {
  const el = document.getElementById(`slot${slot}`);
  if (!el) return;
  el.classList.remove('pressed');
  void el.offsetWidth;          // reflow so the animation restarts on rapid presses
  el.classList.add('pressed');
}

function connected() {
  return device && device.gatt && device.gatt.connected;
}

function refreshButtons() {
  const on = connected();
  document.querySelectorAll('.slot button').forEach(b => { b.disabled = !on; });
  $('#connect').textContent = on ? 'Disconnect' : 'Connect';
}

// ── build the slot editors ──────────────────────────────────────────────────
function buildSlots() {
  const host = $('#slots');
  for (let slot = 1; slot <= 5; slot++) {
    const d = DEFAULTS[slot];
    const el = document.createElement('div');
    el.className = 'slot';
    el.id = `slot${slot}`;
    el.innerHTML = `
      <h2>Slot ${slot}</h2>
      <div class="device">
        <span id="dev${slot}" class="none">No device assigned</span>
      </div>
      <div class="field">
        <label for="func${slot}">Function</label>
        <select id="func${slot}" disabled><option value="">assign a device first</option></select>
      </div>
      <div class="readout" id="out${slot}"></div>
      <div class="actions">
        <button class="ghost" data-save="${slot}">Save</button>
        <button data-test="${slot}">Test</button>
      </div>
      <details>
        <summary>Advanced — manual hex</summary>
        <div class="row">
          <div class="field grow">
            <label for="proto${slot}">Protocol</label>
            <select id="proto${slot}">
              ${PROTOCOLS.map(p => `<option ${p === d.proto ? 'selected' : ''}>${p}</option>`).join('')}
            </select>
          </div>
          <div class="field grow">
            <label for="code${slot}">Hex code</label>
            <input id="code${slot}" value="${d.code}" placeholder="0xE0E040BF"
                   autocapitalize="off" autocorrect="off" spellcheck="false">
          </div>
          <div class="field narrow">
            <label for="bits${slot}">Bits</label>
            <input id="bits${slot}" type="number" inputmode="numeric" value="${d.bits}" min="1" max="64">
          </div>
        </div>
      </details>`;
    host.appendChild(el);
  }

  host.addEventListener('click', (e) => {
    const save = e.target.dataset.save, test = e.target.dataset.test;
    if (save) saveSlot(Number(save));
    if (test) testSlot(Number(test));
  });

  // Function dropdown drives the slot; manual edits keep the readout honest.
  host.addEventListener('change', (e) => {
    const m = /^(func|proto|code|bits)(\d)$/.exec(e.target.id || '');
    if (!m) return;
    const slot = Number(m[2]);
    if (m[1] === 'func') applyFunction(slot, Number(e.target.value));
    else updateReadout(slot);
  });
  host.addEventListener('input', (e) => {
    const m = /^(code|bits)(\d)$/.exec(e.target.id || '');
    if (m) updateReadout(Number(m[2]));
  });

  for (let slot = 1; slot <= 5; slot++) updateReadout(slot);
}

// ── slot ↔ device binding ───────────────────────────────────────────────────
// A slot is conceptually "this device, this button": the protocol and address
// belong to the device, and only the command changes when you go power → input.
// slotDevice[n] holds the assigned device plus its sendable entries.
const slotDevice = {};

function updateReadout(slot) {
  const proto = $(`#proto${slot}`).value;
  const code = $(`#code${slot}`).value.trim();
  const bits = $(`#bits${slot}`).value;
  const el = $(`#out${slot}`);
  el.innerHTML = code
    ? `${proto} · ${code} · ${bits} bits`
    : `<span class="empty">empty — pick a function or enter a hex code</span>`;
}

function applyFunction(slot, idx) {
  const dev = slotDevice[slot];
  const e = dev && dev.entries[idx];
  if (!e) return;
  $(`#proto${slot}`).value = e.proto;
  $(`#code${slot}`).value = e.code;
  $(`#bits${slot}`).value = e.bits;
  updateReadout(slot);
  setStatus(`slot ${slot}: ${e.orig} (${e.proto} ${e.code}) — press Save to store it`, 'ok');
}

function assignDevice(slot, { brand, model, entries }, pickIdx = 0) {
  slotDevice[slot] = { brand, model, entries };

  $(`#dev${slot}`).className = '';
  $(`#dev${slot}`).textContent = `${brand} / ${model}`;

  const sel = $(`#func${slot}`);
  sel.innerHTML = entries.map((e, i) =>
    `<option value="${i}">${e.name.startsWith('other:') ? e.orig : `${e.orig} — ${e.name}`}</option>`
  ).join('');
  sel.disabled = false;
  sel.value = String(pickIdx);
  applyFunction(slot, pickIdx);
}

// ── BLE ─────────────────────────────────────────────────────────────────────
async function connect() {
  if (connected()) { device.gatt.disconnect(); return; }
  try {
    setStatus('requesting device…');
    // Filter on the service UUID, not the name. The name lives in the scan
    // response (it does not fit in the advertisement alongside a 128-bit UUID),
    // and matching the service is more robust than matching a string.
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }],
      optionalServices: [SERVICE_UUID],
    });
    device.addEventListener('gattserverdisconnected', () => {
      setStatus('disconnected', 'err');
      refreshButtons();
    });

    setStatus('connecting…');
    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);

    configChar  = await service.getCharacteristic(CONFIG_UUID);
    triggerChar = await service.getCharacteristic(TRIGGER_UUID);
    statusChar  = await service.getCharacteristic(STATUS_UUID);

    await statusChar.startNotifications();
    statusChar.addEventListener('characteristicvaluechanged', (ev) => {
      const text = new TextDecoder().decode(ev.target.value);
      setStatus(`device: ${text}`, text.startsWith('err') ? 'err' : 'ok');

      // A physical button on the device reports "pressed:N" — flash that slot so
      // it is obvious which button was hit, and distinct from an app-driven send.
      const pressed = /^pressed:(\d+)$/.exec(text);
      if (pressed) flashSlot(Number(pressed[1]));

      // "err:empty:N" means that button has no code stored yet.
      const empty = /^err:empty:(\d+)$/.exec(text);
      if (empty) setStatus(`slot ${empty[1]} is empty — save a code to it first`, 'err');
    });

    setStatus('connected', 'ok');
    refreshButtons();
  } catch (err) {
    setStatus(`connect failed: ${err.message}`, 'err');
    refreshButtons();
  }
}

async function write(characteristic, payload) {
  const bytes = new TextEncoder().encode(JSON.stringify(payload));
  // writeValue is deprecated; prefer the explicit form where available.
  if (characteristic.writeValueWithResponse) {
    await characteristic.writeValueWithResponse(bytes);
  } else {
    await characteristic.writeValue(bytes);
  }
}

async function saveSlot(slot) {
  if (!connected()) return setStatus('not connected', 'err');
  const code = $(`#code${slot}`).value.trim();
  if (!code) return setStatus(`slot ${slot}: enter a hex code first`, 'err');

  const payload = {
    slot,
    proto: $(`#proto${slot}`).value,
    code,
    bits: Number($(`#bits${slot}`).value) || 32,
  };
  try {
    setStatus(`saving slot ${slot}…`);
    await write(configChar, payload);
  } catch (err) {
    setStatus(`save failed: ${err.message}`, 'err');
  }
}

async function testSlot(slot) {
  if (!connected()) return setStatus('not connected', 'err');
  try {
    setStatus(`triggering slot ${slot}…`);
    await write(triggerChar, { slot });
  } catch (err) {
    setStatus(`test failed: ${err.message}`, 'err');
  }
}

// ── code library ────────────────────────────────────────────────────────────
// index.json is small (~40K) and loads once; brand shards are fetched on demand
// and cached. Served statically alongside the app, so this works on Pages and
// on localhost identically.

const DATA_BASE = '../data';
let libIndex = null;
const shardCache = new Map();
let libEntries = [];          // entries for the currently selected model

const libCategory = $('#libCategory'), libBrand = $('#libBrand');
const libModel = $('#libModel'), libFunction = $('#libFunction');
const libApply = $('#libApply'), libInfo = $('#libInfo');

function fillSelect(sel, items, placeholder) {
  sel.innerHTML = `<option value="">${placeholder}</option>` +
    items.map(({ value, label }) =>
      `<option value="${value.replace(/"/g, '&quot;')}">${label}</option>`).join('');
  sel.disabled = items.length === 0;
}

// Canonical functions first and in a useful order — power and inputs are the
// two things this whole library exists to make reachable.
const FUNC_ORDER = [
  'power_toggle', 'power_on', 'power_off', 'source_cycle',
  'input_hdmi', 'input_hdmi1', 'input_hdmi2', 'input_hdmi3', 'input_hdmi4',
  'input_vga', 'input_comp', 'vol_up', 'vol_dn', 'mute', 'menu',
];
const funcRank = (n) => {
  const i = FUNC_ORDER.indexOf(n);
  return i === -1 ? FUNC_ORDER.length : i;
};

async function loadLibIndex() {
  try {
    const res = await fetch(`${DATA_BASE}/db/index.json`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    libIndex = await res.json();
    fillSelect(libCategory, Object.entries(libIndex).map(([slug, c]) => ({
      value: slug,
      label: `${c.label} (${Object.keys(c.brands).length} brands)`,
    })), 'Select category…');
    libInfo.textContent = 'Pick a category to browse. Manual hex entry still works below.';
  } catch (err) {
    libCategory.innerHTML = '<option value="">unavailable</option>';
    libInfo.textContent = `Code library unavailable: ${err.message}`;
  }
}

libCategory.addEventListener('change', () => {
  const cat = libIndex?.[libCategory.value];
  resetFrom('brand');
  if (!cat) return;
  const brands = Object.entries(cat.brands)
    .sort((a, b) => a[0].localeCompare(b[0]))
    .map(([name, b]) => ({ value: name, label: `${name} (${b.total})` }));
  fillSelect(libBrand, brands, 'Select brand…');
});

libBrand.addEventListener('change', async () => {
  resetFrom('model');
  const cat = libIndex?.[libCategory.value];
  const brand = cat?.brands[libBrand.value];
  if (!brand) return;

  libInfo.textContent = `Loading ${libBrand.value}…`;
  let entries = shardCache.get(brand.file);
  if (!entries) {
    try {
      const res = await fetch(`${DATA_BASE}/db/${brand.file}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      entries = await res.json();
      shardCache.set(brand.file, entries);
    } catch (err) {
      libInfo.textContent = `Could not load ${libBrand.value}: ${err.message}`;
      return;
    }
  }
  // RAW timing arrays need chunked BLE writes, and RC5/RC6 need firmware support
  // that lands in Sitting B. Both stay in the data (no re-scrape needed later)
  // but are hidden here so nothing unsendable can be picked.
  const sendable = entries.filter(e => SENDABLE.has(e.proto));
  const models = [...new Set(sendable.map(e => e.model))].sort();
  fillSelect(libModel, models.map(m => ({ value: m, label: m })), 'Select model…');
  const hidden = entries.length - sendable.length;
  libInfo.textContent = `${libBrand.value}: ${models.length} keymaps, ` +
    `${sendable.length} sendable codes` +
    (hidden ? ` (${hidden} hidden — RAW or RC5/RC6, not sendable yet)` : '');
  shardCache.set(brand.file, entries);
  libModel.dataset.file = brand.file;
});

libModel.addEventListener('change', () => {
  resetFrom('function');
  const entries = shardCache.get(libModel.dataset.file) || [];
  libEntries = entries
    .filter(e => e.model === libModel.value && SENDABLE.has(e.proto))
    .sort((a, b) => funcRank(a.name) - funcRank(b.name) ||
                    a.orig.localeCompare(b.orig));

  fillSelect(libFunction, libEntries.map((e, i) => ({
    value: String(i),
    label: e.name.startsWith('other:') ? e.orig : `${e.orig} — ${e.name}`,
  })), 'Select function…');
});

libFunction.addEventListener('change', () => {
  const e = libEntries[Number(libFunction.value)];
  libApply.disabled = !e;
  if (!e) return;
  libInfo.textContent =
    `${e.proto} ${e.code} (${e.bits} bits) · ${e.brand} ${e.model} · "${e.orig}"`;
});

libApply.addEventListener('click', () => {
  const e = libEntries[Number(libFunction.value)];
  if (!e) return;
  const slot = Number($('#libSlot').value);

  // Belt and braces: never write a protocol the slot dropdown cannot represent,
  // because that would silently leave the old protocol next to the new code.
  if (!SENDABLE.has(e.proto)) {
    setStatus(`${e.proto} is not sendable yet — pick another code`, 'err');
    return;
  }

  // Assign the whole device to the slot, not just this one code — that is what
  // lets the slot's Function dropdown swap power → input without coming back here.
  assignDevice(slot, { brand: e.brand, model: e.model, entries: libEntries },
               Number(libFunction.value));

  flashSlot(slot);
  document.getElementById(`slot${slot}`)
    ?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  setStatus(`slot ${slot} ← ${e.brand} ${e.model}: ${e.orig} ` +
            `(${libEntries.length} functions available)`, 'ok');
});

function resetFrom(level) {
  const clear = (sel) => { sel.innerHTML = '<option value="">—</option>'; sel.disabled = true; };
  if (level === 'brand') clear(libBrand);
  if (level === 'brand' || level === 'model') clear(libModel);
  clear(libFunction);
  libApply.disabled = true;
  libEntries = [];
}

// ── init ────────────────────────────────────────────────────────────────────
buildSlots();
refreshButtons();
loadLibIndex();
$('#connect').addEventListener('click', connect);

if (!navigator.bluetooth) {
  $('#unsupported').hidden = false;
  $('#connect').disabled = true;
  setStatus('Web Bluetooth unavailable in this browser', 'err');
}
</script>
</body>
</html>
